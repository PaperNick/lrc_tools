name: Build Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            display: Linux-x64
            artifact: lrc_tools
          - os: windows-2025
            display: Windows-x64
            artifact: lrc_tools.exe
          - os: macos-15-intel
            display: macOS-x64
            artifact: lrc_tools
          - os: macos-15
            display: macOS-ARM64
            artifact: lrc_tools
      fail-fast: false

    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build with PyInstaller
        run: |
          pyinstaller lrc_tools.spec

      - name: Package binary into zip
        shell: bash
        run: |
          cd dist
          if [[ "${{ runner.os }}" == Windows ]]; then
            7z a "../lrc_tools-${{ matrix.display }}.zip" lrc_tools.exe
          else
            zip "../lrc_tools-${{ matrix.display }}.zip" lrc_tools
          fi

      - name: Upload to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: lrc_tools-${{ matrix.display }}.zip
          tag: ${{ github.ref }}
          overwrite: true
