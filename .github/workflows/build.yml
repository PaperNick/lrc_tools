name: Build Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            display: Linux-x64
          - os: windows-2025
            display: Windows-x64
          - os: macos-15-intel
            display: macOS-x64
          - os: macos-15
            display: macOS-ARM64
      fail-fast: false

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build with PyInstaller
        run: |
          pyinstaller lrc_tools.spec

      - name: Upload binary
        uses: actions/upload-artifact@v6
        with:
          name: lrc_tools-${{ matrix.display }}
          path: |
            dist/lrc_tools*
            dist/*.exe
          if-no-files-found: error

      - name: Upload to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: dist/lrc_tools*
          tag: ${{ github.ref }}
          overwrite: true
          file_glob: true
